# Render blueprint: Settl as one free web service built from this repository.
#
# It runs on the Sepolia test network: visitors connect MetaMask, sign with
# their own wallet, and every vault is a contract on a public chain. Test money only.
#
# The free plan sleeps when idle. When the service wakes it starts with no
# deals: the vaults themselves stay on the chain, but the list of workspaces is
# kept in a file that does not survive a restart.
services:
  - type: web
    name: settl
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx hardhat compile && npx vite build
    startCommand: node server/src/index.js --testnet
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Paste the key in the Render dashboard. It is never stored in this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
