# Render blueprint: one free web service that runs the whole of Settl.
#
# It runs on the chain inside the server, so visitors need no wallet: they add
# demo people and all money is pretend. The free plan sleeps when idle and
# starts empty when it wakes, which suits a demonstration.
#
# For the Sepolia test network instead, change startCommand to:
#   node server/src/index.js --testnet
services:
  - type: web
    name: settl
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx hardhat compile && npx vite build
    startCommand: node server/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Paste the key in the Render dashboard. It is never stored in this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
