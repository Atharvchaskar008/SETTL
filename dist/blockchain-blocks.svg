    <text x="585.0" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Header</text>
    <rect x="468" y="162" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="585.0" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Previous Block Address</text>
    <rect x="468" y="204" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="585.0" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Timestamp</text>
    <rect x="468" y="246" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="585.0" y="270" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Nonce</text>
    <rect x="468" y="288" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="585.0" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Merkle Root</text>
    <ellipse cx="1010" cy="358" rx="150" ry="9" fill="#000814" opacity="0.35"/>
    <g stroke="#052A4D" stroke-width="2" stroke-linejoin="round">
      <polygon points="860,70 896,34 1166,34 1130,70" fill="url(#top)"/>
      <polygon points="1130,70 1166,34 1166,302 1130,338" fill="url(#side)"/>
      <rect x="860" y="70" width="270" height="268" fill="url(#front)"/>
    </g>
    <text x="995.0" y="102" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Block n+1</text>
    <rect x="878" y="120" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="995.0" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Header</text>
    <rect x="878" y="162" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="995.0" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Previous Block Address</text>
    <rect x="878" y="204" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="995.0" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Timestamp</text>
    <rect x="878" y="246" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="995.0" y="270" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Nonce</text>
    <rect x="878" y="288" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="995.0" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Merkle Root</text>
    <path d="M58 180 H18" fill="none" stroke="#F5A524" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#arr)"/>
    <path d="M468 180 H358" fill="none" stroke="#F5A524" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#arr)"/>
    <path d="M878 180 H768" fill="none" stroke="#F5A524" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#arr)"/>
    <text x="605" y="392" text-anchor="middle" font-size="13" fill="#A9C7E4">Each block stores the address of the block before it. That is what links the chain.</text>
  </g>
</svg>