<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 410" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Blocks linked in a chain</title>
  <desc id="d">Three blocks, n-1, n and n+1, joined by chain links. Each block contains a header, the previous block address, a timestamp, a nonce and a Merkle root. The previous block address points back to the block before it.</desc>
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D93E6"/><stop offset="1" stop-color="#0B73C2"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC6F5"/><stop offset="1" stop-color="#4DAEEF"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A5FA3"/><stop offset="1" stop-color="#074A82"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3A68"/><stop offset="1" stop-color="#082647"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L9,5 L0,9.5 z" fill="#F5A524"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="1209" height="409" rx="14" fill="url(#bg)" stroke="#1F5A94"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">

    <g>
      <rect x="346" y="89" width="42" height="26" rx="13" fill="none" stroke="#CBD5E1" stroke-width="5"/>
      <rect x="370" y="97.5" width="52" height="9" rx="4.5" fill="#CBD5E1"/>
      <rect x="404" y="89" width="42" height="26" rx="13" fill="none" stroke="#CBD5E1" stroke-width="5"/>
    </g>
    <g>
      <rect x="756" y="89" width="42" height="26" rx="13" fill="none" stroke="#CBD5E1" stroke-width="5"/>
      <rect x="780" y="97.5" width="52" height="9" rx="4.5" fill="#CBD5E1"/>
      <rect x="814" y="89" width="42" height="26" rx="13" fill="none" stroke="#CBD5E1" stroke-width="5"/>
    </g>
    <ellipse cx="190" cy="358" rx="150" ry="9" fill="#000814" opacity="0.35"/>
    <g stroke="#052A4D" stroke-width="2" stroke-linejoin="round">
