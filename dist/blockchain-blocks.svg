      <polygon points="310,70 346,34 346,302 310,338" fill="url(#side)"/>
      <rect x="40" y="70" width="270" height="268" fill="url(#front)"/>
    </g>
    <text x="175.0" y="102" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Block n-1</text>
    <rect x="58" y="120" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="175.0" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Header</text>
    <rect x="58" y="162" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="175.0" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Previous Block Address</text>
    <rect x="58" y="204" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="175.0" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Timestamp</text>
    <rect x="58" y="246" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="175.0" y="270" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Nonce</text>
    <rect x="58" y="288" width="234" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="175.0" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5E9E">Merkle Root</text>
    <ellipse cx="600" cy="358" rx="150" ry="9" fill="#000814" opacity="0.35"/>
    <g stroke="#052A4D" stroke-width="2" stroke-linejoin="round">
      <polygon points="450,70 486,34 756,34 720,70" fill="url(#top)"/>
      <polygon points="720,70 756,34 756,302 720,338" fill="url(#side)"/>
      <rect x="450" y="70" width="270" height="268" fill="url(#front)"/>
